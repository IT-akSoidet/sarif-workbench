{% extends "base.html" %}
{% block title %}Search — py-bookstore{% endblock %}
{% block content %}
  <h2>Books</h2>

  <form action="/search" method="get">
    <input type="text" name="q" value="{{ query }}" placeholder="Search by title">
    <button type="submit">Search</button>
  </form>

  <ul class="books">
    {% for book in books %}
      <li>
        <a href="/books/{{ book.id }}">{{ book.title }}</a>
        by {{ book.author }} — ${{ book.price }}
      </li>
    {% endfor %}
  </ul>
{% endblock %}
